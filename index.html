<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-box">
    <div class="titlebar">
      <div class="tab">Lager-Pages</div>
      <span class="tab-plus">+</span>
    </div>
    <div id="inhalt">
      <div id="ebene1" class="screen">
        <div id="gruppen-grid" class="gruppen-grid"></div>
      </div>
      <div id="ebene2" class="screen hidden">
        <div class="menu-bar">
          <button id="back" class="menu-button" data-back="ebene1">Back</button>
          <button id="find-placeholder" class="menu-button">Find</button>
        </div>
        <h2 id="ebene2-titel"></h2>
        <div id="regale"></div>
      </div>
      <div id="ebene3" class="screen hidden">
        <div class="menu-bar">
          <button class="menu-button" data-back="ebene2">Back</button>
          <button class="menu-button">Find</button>
        </div>
        <h2 id="ebene3-titel"></h2>
        <div id="faecher"></div>
      </div>
      <div id="ebene4" class="screen hidden">
        <div class="menu-bar">
          <button class="menu-button" data-back="ebene3">Back</button>
          <button class="menu-button">Find</button>
        </div>
        <h2 id="ebene4-titel"></h2>
        <div id="items"></div>
      </div>
    </div>
  </div>
  <script type="module" src="controller/app.js"></script>
</body>
</html>
